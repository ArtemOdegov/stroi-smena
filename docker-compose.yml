services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: corp
      POSTGRES_PASSWORD: corp
      POSTGRES_DB: corp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    # API на всех интерфейсах контейнера → проброс 9000:9000 доступен с Wi‑Fi (хост)
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "0.0.0.0:9000:9000"
      - "0.0.0.0:9001:9001"
    restart: unless-stopped
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
